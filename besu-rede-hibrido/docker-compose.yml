services:
  hibrido1:
    image: hyperledger/besu:latest
    container_name: hibrido1
    volumes:
      - ./networkFiles/genesis.json:/opt/besu/genesis.json
      - ./nodes/hibrido1:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/genesis.json
      - --sync-min-peers=1
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,IBFT,ADMIN
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --p2p-port=30303
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
      - --logging=INFO
    ports:
      - "8745:8545"
      - "30503:30303"
      - "9745:9545"
    networks:
      hibrido-net:
        ipv4_address: 10.88.2.11

  hibrido2:
    image: hyperledger/besu:latest
    container_name: hibrido2
    volumes:
      - ./networkFiles/genesis.json:/opt/besu/genesis.json
      - ./nodes/hibrido2:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/genesis.json
      - --sync-min-peers=1
      - --bootnodes=enode://fd09ef790f0511b5a215fa8489696011d521c0d36fa76fb6b8bbb38a0d5918be71507fe4f8410c80d46e4937a6be8fde31b6d2a13fb17c1896461976416cc980@10.88.2.11:30303
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,IBFT,ADMIN
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --p2p-port=30303
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
      - --logging=INFO
    ports:
      - "8746:8545"
      - "30504:30303"
    networks:
      hibrido-net:
        ipv4_address: 10.88.2.12

  hibrido3:
    image: hyperledger/besu:latest
    container_name: hibrido3
    volumes:
      - ./networkFiles/genesis.json:/opt/besu/genesis.json
      - ./nodes/hibrido3:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/genesis.json
      - --sync-min-peers=1
